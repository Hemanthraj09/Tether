name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Unit tests · Lint · Debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The real Firebase config is a secret; forks and PRs build with a placeholder.
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            cp .github/ci/google-services.placeholder.json app/google-services.json
          fi

      - name: Unit tests, lint and debug build
        run: ./gradlew --no-configuration-cache testDebugUnitTest lintDebug assembleDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  firestore-rules:
    name: Firestore security rules (emulator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4   # the Firestore emulator runs on the JVM
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - run: npm ci
      - run: npm test

  release:
    name: Signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, firestore-rules]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Provide Firebase config and signing key
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.TETHER_KEYSTORE_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tether.jks"

      - name: Build release APK
        env:
          TETHER_KEYSTORE_PATH: ${{ runner.temp }}/tether.jks
          TETHER_KEYSTORE_PASSWORD: ${{ secrets.TETHER_KEYSTORE_PASSWORD }}
          TETHER_KEY_ALIAS: ${{ secrets.TETHER_KEY_ALIAS }}
          TETHER_KEY_PASSWORD: ${{ secrets.TETHER_KEY_PASSWORD }}
        run: |
          ./gradlew --no-configuration-cache assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Tether.apk

      # The README's download badge points at releases/latest/download/Tether.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: Tether.apk
          generate_release_notes: true
